  <div class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-md text-center border border-slate-700">
    <h1 class="text-2xl font-bold mb-4 text-amber-400"> Sorteio de Carros</h1>
    
    <!-- Seleção de Categoria -->
    <label for="classeSelect" class="block text-sm font-medium mb-2 text-slate-300">Escolha a Classe:</label>
    <select id="classeSelect" class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 text-white mb-6 focus:outline-none focus:ring-2 focus:ring-amber-400">
      <option value="D" selected>Classe D</option>
      <option value="C">Classe C</option>
      <option value="B">Classe B</option>
      <option value="A">Classe A</option>
      <option value="S1">Classe S1</option>
      <option value="S2">Classe S2</option>
      <option value="R">Classe R</option>
      <option value="X">Classe X</option>
      <option value="TODAS">Todas as classes</option>
    </select>

    <!-- Botão de Sorteio -->
    <button onclick="sortear()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 px-6 rounded-lg transition-all active:scale-95 shadow-lg">
      Sortear Carro
    </button>

    <!-- Resultado -->
    <div id="resultado" class="mt-6 p-4 bg-slate-900/60 rounded-lg border border-slate-700 min-h-[100px] flex flex-col items-center justify-center">
      <p class="text-slate-400 text-sm">Escolha a classe e clique no botão para sortear...</p>
    </div>

    function sortear() {
  const classeEscolhida = document.getElementById("classeSelect").value;
  const filtrados = classeEscolhida === "TODAS"
  ? carros
    : carros.filter(c => c["PI Class"] === classeEscolhida);
  const resDiv = document.getElementById("resultado");

  if (filtrados.length === 0) {
    resDiv.innerHTML = `<span class="text-red-400">Nenhum carro encontrado para a classe ${classeEscolhida}.</span>`;
    return;
  }

  const sorteado = filtrados[Math.floor(Math.random() * filtrados.length)];
  const basePath = "images/carros/";

  const imgHtml = sorteado.img
    ? `<img src="${basePath}${sorteado.img}" alt="${sorteado.Carro}"
         class="!w-auto !max-w-[320px] !h-auto mx-auto rounded-lg mb-3 border border-slate-600 block"
         onerror="this.style.display='none'; document.getElementById('imgFallback').style.display='block';">`
    : "";

  resDiv.innerHTML = `
    <div class="space-y-1 w-full">
      ${imgHtml}
      <div id="imgFallback" class="text-xs text-slate-500 ${sorteado.img ? "hidden" : ""}">Imagem não disponível</div>
      <div class="inline-block bg-amber-500/20 text-amber-400 text-xs font-bold px-2.5 py-1 rounded-full uppercase tracking-wider mb-1">
        Classe ${sorteado["PI Class"]} · PI ${sorteado["PI #"]}
      </div>
      <h2 class="text-xl font-extrabold text-white">${sorteado.Carro}</h2>
    </div>
  `;
}
  </script>
